# NOTE: This is a template. DO NOT COMMIT ACTUAL SECRETS.
# Create actual secrets using:
# kubectl create secret generic database-credentials --from-literal=connection-string=mongodb://... -n expense-tracker
# kubectl create secret generic jwt-secret --from-literal=secret=your-secret-key -n expense-tracker

apiVersion: v1
kind: Secret
metadata:
  name: database-credentials
  namespace: expense-tracker
type: Opaque
stringData:
  # REPLACE with actual MongoDB connection string
  connection-string: "mongodb+srv://username:password@cluster.mongodb.net/expense-tracker"

---
apiVersion: v1
kind: Secret
metadata:
  name: jwt-secret
  namespace: expense-tracker
type: Opaque
stringData:
  # REPLACE with actual JWT secret (min 32 chars)
  secret: "your-secret-key-change-this-in-production"

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: expense-tracker
data:
  NODE_ENV: "production"
  CORS_ORIGIN: "https://yourdomain.com"
  # Frontend API endpoint
  REACT_APP_API_URL: "https://api.yourdomain.com"
