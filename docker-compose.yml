version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: expense-tracker-mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password
      MONGO_INITDB_DATABASE: expense-tracker
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - expense-tracker-network

  backend:
    build:
      context: ./back-end
      dockerfile: Dockerfile
    container_name: expense-tracker-backend
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: development
      PORT: 5000
      DB_URL: mongodb://admin:password@mongodb:27017/expense-tracker
      JWT_SECRET: ${JWT_SECRET:-your-secret-key-change-in-production}
    depends_on:
      mongodb:
        condition: service_healthy
    volumes:
      - ./back-end/src:/app/src
      - ./back-end/dist:/app/dist
    networks:
      - expense-tracker-network
    restart: unless-stopped

  frontend:
    build:
      context: ./front-end
      dockerfile: Dockerfile
    container_name: expense-tracker-frontend
    ports:
      - "3000:3000"
    environment:
      REACT_APP_API_URL: http://localhost:5000
      NODE_ENV: development
    depends_on:
      - backend
    volumes:
      - ./front-end/src:/app/src
      - ./front-end/public:/app/public
    networks:
      - expense-tracker-network
    restart: unless-stopped

volumes:
  mongodb_data:
  mongodb_config:

networks:
  expense-tracker-network:
    driver: bridge
